<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08070a" />
  <title>Interactive Slide Deck · BW/S SS27</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" />
  <!-- 01 · Interactive Slide Deck. The FINAL v25 package sits unchanged in deck/ (28 files, its CHECKSUMS pass); this
       page shows it full-window and adds only the "‹ MAIN" link at the bottom left of the deck's thumbnail rail, in the
       rail's own label style. A #n in this page's address opens slide n, as in the deck. -->
  <style>
    html, body { height: 100%; margin: 0; background: #08070a; overflow: hidden; }
    .deck { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #08070a; }
    /* bottom of the 212 px rail; level with the deck's control row at the bottom right */
    .main-link {
      position: fixed; left: 0; bottom: 0; width: 211px; height: 58px; z-index: 2;
      display: flex; align-items: flex-end; padding: 0 16px 24px;
      background: linear-gradient(180deg, rgba(8, 7, 10, 0) 0%, #08070a 45%);
      /* 10% larger than the rail label (10 px), level with the 10%-larger deck controls */
      font: 600 11px/1 "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 125%;
      letter-spacing: 0.22em; text-transform: uppercase; color: #a69f96; text-decoration: none;
      transition: color 0.25s ease;
    }
    .main-link span { display: inline-flex; align-items: center; gap: 8.8px; }
    .main-link svg { width: 13.2px; height: 13.2px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .main-link:hover, .main-link:focus-visible { color: #f3ede4; outline: none; }
    .main-link:focus-visible span { outline: 1px solid #f3ede4; outline-offset: 4px; }
    /* presentation mode (F) hides the rail, and the link with it */
    html.present .main-link { display: none; }
    /* phones: the deck puts its thumbnails in a row at the top; the link sits bottom left on its own */
    @media (max-width: 760px) { .main-link { width: auto; height: auto; padding: 14px 16px 20px; background: none; } }
  </style>
</head>
<body>
  <iframe class="deck" title="BW/S SS27 interactive slide deck" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <a class="main-link" href="../../index.html"><span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" /></svg>MAIN</span></a>
  <script>
    (() => {
      const frame = document.querySelector('.deck');
      frame.src = './deck/BWS_SS27_More_is_More_Model4Cover_v25.html' + (location.hash || '');
      const blockZoom = e => { if (e.ctrlKey) e.preventDefault(); };
      window.addEventListener('wheel', blockZoom, { passive: false });
      frame.addEventListener('load', () => {
        const win = frame.contentWindow, doc = frame.contentDocument;
        try {
          win.focus();                                            // the deck's keys work at once, without a first click
          // the deck's control row (01 / 06, ‹ ›, sound, full screen) 10% larger, anchored at its bottom-right corner;
          // added at run time, the deck file itself is not edited
          const st = doc.createElement('style');
          st.id = 'portfolio-hud-110';
          st.textContent = '.hud{transform:scale(1.1);transform-origin:100% 100%}';
          doc.head.appendChild(st);
          win.addEventListener('wheel', blockZoom, { passive: false });
          // follow the deck's presentation mode (the rail is hidden there)
          const sync = () => document.documentElement.classList.toggle('present', doc.body.classList.contains('present'));
          new MutationObserver(sync).observe(doc.body, { attributes: true, attributeFilter: ['class'] });
          sync();
        } catch { /* deck not reachable: the link still works */ }
      });
    })();
  </script>
</body>
</html>
