<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9e2d5" />
  <title>Sculptural Essentials — The Art Of Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" />
  <!-- 03 · Blender Interactive Modeling. The FINAL build sits unchanged in app/ (4 files, identical to the verified
       2026-11-18 build); this page shows it full-window and adds only a "‹ MAIN" link at the start of the viewer's
       bottom hint row ("✣ DRAG TO ROTATE • SCROLL TO ZOOM"), in that row's type. The row is pushed right to make room
       by a style added to the viewer at run time; place and type are read from the viewer, so they follow every size. -->
  <style>
    html, body { height: 100%; margin: 0; background: #e9e2d5; overflow: hidden; }
    .app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #e9e2d5; }
    .main-link {
      position: fixed; z-index: 2; top: 0; left: 0; transform: translateY(-50%); visibility: hidden;
      display: inline-flex; align-items: center; gap: 0.55em; padding: 8px 0; white-space: nowrap;
      font: 700 12px/1 "DM Sans", Arial, sans-serif; letter-spacing: 0.12em; color: #4c463e; text-decoration: none;
      transition: color 0.2s ease;
    }
    .main-link.is-placed { visibility: visible; }
    .main-link svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .main-link:hover, .main-link:focus-visible { color: #a07034; outline: none; }
    .main-link:focus-visible { box-shadow: 0 1px 0 currentColor; }
    html.app-fullscreen .main-link { display: none; }
  </style>
  <link rel="stylesheet" href="../../assets/for-bws.css" />
  <style>
    /* 2026-11-24: FOR BW/S at the right end of the viewer's top bar (placed by the script below) */
    .for-bws-fixed { position: fixed; z-index: 2; top: 0; right: 24px; transform: translateY(-50%); visibility: hidden; }
    .for-bws-fixed.is-placed { visibility: visible; }
    html.app-fullscreen .for-bws-fixed { display: none; }
    /* MAIN pill: left end of the viewer's top bar, centred on the wordmark (placed by the script) */
    .main-pill-bar { position: fixed; z-index: 2; top: 0; left: 0; transform: translateY(-50%); visibility: hidden; }
    .main-pill-bar.is-placed { visibility: visible; }
    .main-pill-bar:hover, .main-pill-bar:focus-visible { transform: translateY(calc(-50% - 1px)); }
    html.app-fullscreen .main-pill-bar { display: none; }
  </style>
</head>
<body>
  <iframe class="app" src="./app/index.html" title="Sculptural Essentials: the Art of Form gold cuff, interactive 3D viewer" allow="fullscreen" allowfullscreen></iframe>
  <a class="for-bws for-bws--dark for-bws-fixed" href="../contribution/index.html" aria-label="For BW/S: strategic contribution"><span class="for-bws-main" aria-hidden="true">FOR BW/S<svg viewBox="0 0 20 20"><path d="M4 16 16 4M7.5 4H16v8.5" /></svg></span><span class="for-bws-sub" aria-hidden="true">STRATEGIC CONTRIBUTION</span></a>
  <!-- 2026-11-24: MAIN pill at the left of the viewer's top bar; the "Sculptural Essentials." wordmark moves right to make room
       (was "‹ MAIN" at the start of the bottom hint row) -->
  <a class="main-pill main-pill-bar" href="../../index.html" aria-label="Back to the main page"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" /></svg>MAIN</a>
  <script>
    (() => {
      const frame = document.querySelector('.app');
      const pill = document.querySelector('.main-pill-bar');
      const bws = document.querySelector('.for-bws-fixed');
      const blockZoom = e => { if (e.ctrlKey) e.preventDefault(); };
      window.addEventListener('wheel', blockZoom, { passive: false });
      frame.addEventListener('load', () => {
        let doc, win;
        try { doc = frame.contentDocument; win = frame.contentWindow; } catch {
          pill.classList.add('is-placed'); pill.style.left = '24px'; pill.style.top = '40px';
          bws.classList.add('is-placed'); bws.style.top = '40px'; return;
        }
        win.addEventListener('wheel', blockZoom, { passive: false });
        const room = doc.createElement('style');
        room.id = 'portfolio-main-room';
        doc.head.appendChild(room);
        // 2026-11-24: MAIN pill at the left end of the top bar, the wordmark moved right by the pill's width plus a gap;
        // FOR BW/S at the right end (just below the bar when the bar is too narrow for both)
        const place = () => {
          const header = doc.querySelector('.site-header'), mark = doc.querySelector('.wordmark');
          if (!header || !mark) return false;
          const gap = win.innerWidth <= 640 ? 14 : 22;
          room.textContent = `.wordmark{margin-left:${Math.ceil(pill.getBoundingClientRect().width + gap)}px}`;
          const hs = win.getComputedStyle(header);
          const hr = header.getBoundingClientRect(), mr = mark.getBoundingClientRect();
          const pl = parseFloat(hs.paddingLeft) || 20, pr = parseFloat(hs.paddingRight) || 20;
          const midY = (mr.top + mr.bottom) / 2;
          pill.style.left = `${hr.left + pl}px`;
          pill.style.top = `${midY}px`;
          pill.classList.add('is-placed');
          const bw = bws.getBoundingClientRect().width;
          const fits = mr.right + 16 + bw <= hr.right - pr;
          bws.style.right = `${win.innerWidth - hr.right + pr}px`;
          bws.style.top = fits ? `${midY}px` : `${hr.bottom + 12 + bws.getBoundingClientRect().height / 2}px`;
          bws.classList.add('is-placed');
          return true;
        };
        // the viewer is a React app: wait for the header, then follow resizes, fonts and full screen
        const tryPlace = () => { if (!place()) requestAnimationFrame(tryPlace); };
        tryPlace();
        win.addEventListener('resize', place);
        new win.ResizeObserver(place).observe(doc.body);
        doc.addEventListener('fullscreenchange', () => document.documentElement.classList.toggle('app-fullscreen', !!doc.fullscreenElement));
        doc.fonts && doc.fonts.ready.then(place);
        document.fonts && document.fonts.ready.then(place);
      });
    })();
  </script>
</body>
</html>
